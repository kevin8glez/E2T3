<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Bezeroak</ion-title>
  </ion-toolbar>
  
  <ion-toolbar>
    <ion-searchbar 
      [(ngModel)]="searchTerm" 
      (ionInput)="filterClients()"
      placeholder="Bilatu bezeroa...">
    </ion-searchbar>
  </ion-toolbar>

  <ion-toolbar>
    <ion-button expand="block" (click)="addClient()" color="success">
      <ion-icon name="add" slot="start"></ion-icon>
      BEZERO BERRIA GEHITU
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let client of filteredClients" style="margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
      <ion-label>
        <h2><strong>{{ client.name }} {{ client.surname }}</strong></h2>
        <p> {{ client.phone }}</p>
        <p *ngIf="client.email"> {{ client.email }}</p>
        <p>
          <span [style.color]="client.home_client ? 'purple' : 'gray'">
            {{ client.home_client ? ' Etxez etxe' : ' Aretoan' }}
          </span>
        </p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button (click)="editClient(client)" color="primary" style="background: #3880ff; color: white; margin-right: 5px;">
          <ion-icon name="create" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button (click)="confirmDelete(client)" color="danger" style="background: #eb445a; color: white;">
          <ion-icon name="trash" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>

    <ion-item *ngIf="filteredClients.length === 0">
      <ion-label class="ion-text-center">
        <h3>Ez dago bezerorik</h3>
        <p>Sakatu BEZERO BERRIA GEHITU botoia bat sortzeko</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
