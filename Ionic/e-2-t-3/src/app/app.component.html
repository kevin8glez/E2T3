<ion-app>
  <ion-split-pane contentId="main-content" [disabled]="isSmallScreen" class="right-split-pane">
    <ion-menu contentId="main-content" side="end" type="overlay" class="custom-menu">
      <ion-header>
        <ion-toolbar color="light">
          <ion-title>ARTALE</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="menu-content">
        <div class="menu-profile">
          <div class="profile-avatar">
            <img src="https://i.pravatar.cc/150?img=7" alt="profile">
          </div>
          <h3>Kaixo, Bezero</h3>
          <p>bezeroa@artale.eus</p>
        </div>

        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/hasiera" routerDirection="root" lines="none">
              <ion-icon slot="start" name="home-outline"></ion-icon>
              <ion-label>Hasiera</ion-label>
            </ion-item>

            <ion-item routerLink="/zerbitzuak" routerDirection="root">
              <ion-icon slot="start" name="cut-outline"></ion-icon>
              <ion-label>Zerbitzuak</ion-label>
            </ion-item>

            <ion-item routerLink="/hitzorduak" routerDirection="root">
              <ion-icon slot="start" name="calendar-outline"></ion-icon>
              <ion-label>Nire Hitzorduak</ion-label>
            </ion-item>

            <ion-item routerLink="/langileak" routerDirection="root">
              <ion-icon slot="start" name="people-outline"></ion-icon>
              <ion-label>Langileak</ion-label>
            </ion-item>

            <ion-item routerLink="/kontaktua" routerDirection="root">
              <ion-icon slot="start" name="call-outline"></ion-icon>
              <ion-label>Kontaktua</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <div class="menu-footer">
          <ion-item lines="none" button>
            <ion-icon slot="start" name="log-out-outline"></ion-icon>
            <ion-label>Saioa Itxi</ion-label>
          </ion-item>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
